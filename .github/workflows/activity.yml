name: Update activity graph

on:
  schedule:
    - cron: "0 0 * * *" # daily
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch contribution calendar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api graphql -f login="${{ github.repository_owner }}" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection {
                  contributionCalendar {
                    totalContributions
                    weeks { contributionDays { date contributionCount weekday } }
                  }
                }
              }
            }' > calendar.json

      - name: Render the star map
        run: |
          mkdir -p dist
          python3 scripts/generate_activity.py calendar.json dist/activity.svg

      # Published on a separate "output" branch so the bot's daily updates
      # never appear in your main branch history or contributors list.
      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add activity.svg
          git commit -q -m "Update activity graph"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" output
